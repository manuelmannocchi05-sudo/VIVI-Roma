<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pagina non trovata — VIVI Roma</title>
<meta name="theme-color" content="#FFFFFF">
<style>
/* Pagina d'errore autonoma (nessun file esterno obbligatorio): serve anche a Cloudflare Pages per non restituire
   la home al posto di un file mancante. Colori, segno e caratteri dell'app; i caratteri si caricano dalla
   cartella del sito se disponibili, altrimenti restano quelli di sistema. */
html,body{margin:0;min-height:100%}
body{display:grid;place-items:center;min-height:100vh;min-height:100dvh;background:#FFFFFF;color:#16171B;font:16px/1.55 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));box-sizing:border-box}
main{max-width:420px}
.mark{display:block;width:104px;height:72px;margin:0 auto 22px;fill:#C8102E}
.kicker{margin:0 0 10px;font-size:.75rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#C8102E}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:clamp(2.2rem,9vw,3rem);line-height:1.08;margin:0 0 12px}
p{margin:0 0 6px;color:#4B4E55}
.actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:26px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;font-weight:600;text-decoration:none}
.primary{background:#C8102E;color:#FFFFFF;box-shadow:0 10px 24px rgba(200,16,46,.25)}
.primary:hover{background:#A10C25}
.secondary{color:#A10C25}
a:focus-visible{outline:3px solid #C8102E;outline-offset:3px}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 64 44" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M2 40V17Q32 1 62 17V40ZM4 38.2V31.55A2.6 2.6 0 0 1 9.2 31.55V38.2ZM4 26.8V21.95A2.6 2.6 0 0 1 9.2 21.95V26.8ZM12.47 38.2V30.91A2.6 2.6 0 0 1 17.67 30.91V38.2ZM12.47 26.8V20.2A2.6 2.6 0 0 1 17.67 20.2V26.8ZM13.37 13.95H16.77V15.4H13.37ZM20.93 38.2V30.53A2.6 2.6 0 0 1 26.13 30.53V38.2ZM20.93 26.8V19.15A2.6 2.6 0 0 1 26.13 19.15V26.8ZM21.83 12.04H25.23V14.35H21.83ZM29.4 38.2V30.4A2.6 2.6 0 0 1 34.6 30.4V38.2ZM29.4 26.8V18.8A2.6 2.6 0 0 1 34.6 18.8V26.8ZM30.3 11.4H33.7V14H30.3ZM37.87 38.2V30.53A2.6 2.6 0 0 1 43.07 30.53V38.2ZM37.87 26.8V19.15A2.6 2.6 0 0 1 43.07 19.15V26.8ZM38.77 12.04H42.17V14.35H38.77ZM46.33 38.2V30.91A2.6 2.6 0 0 1 51.53 30.91V38.2ZM46.33 26.8V20.2A2.6 2.6 0 0 1 51.53 20.2V26.8ZM47.23 13.95H50.63V15.4H47.23ZM54.8 38.2V31.55A2.6 2.6 0 0 1 60 31.55V38.2ZM54.8 26.8V21.95A2.6 2.6 0 0 1 60 21.95V26.8ZM0 41.6h64v2.4H0Z"/></svg>
  <p class="kicker" id="k">Errore 404</p>
  <h1 id="t">Pagina non trovata</h1>
  <p id="d">L'indirizzo non esiste o è cambiato. Il tuo viaggio, però, può ripartire da qui.</p>
  <div class="actions">
    <a class="primary" id="home" href="/">Torna a VIVI Roma</a>
    <a class="secondary" id="quiz" href="/#crea">Crea un nuovo itinerario</a>
  </div>
</main>
<script>/* su GitHub Pages il sito vive in /VIVI-Roma/, su Cloudflare Pages nella radice; lingua come nell'app */
(function(){
  var m=location.pathname.match(/^\/VIVI-Roma\//i),base=m?m[0]:"/";
  document.getElementById("home").href=base;document.getElementById("quiz").href=base+"#crea";
  var css="";[["Playfair Display","playfair-display-latin-wght-normal"],["DM Sans","dm-sans-latin-wght-normal"]].forEach(function(f){
    css+="@font-face{font-family:'"+f[0]+"';src:url('"+base+"fonts/"+f[1]+".woff2') format('woff2');font-weight:100 900;font-display:swap}";});
  var s=document.createElement("style");s.textContent=css;document.head.appendChild(s);
  var l=null;try{l=localStorage.getItem("vivi-roma:lingua");}catch(e){}
  if(l!=="it"&&l!=="en"){l="it";var ls=navigator.languages||[navigator.language||""];for(var i=0;i<ls.length;i++){var c=String(ls[i]).toLowerCase().slice(0,2);if(c==="it"||c==="en"){l=c;break;}}}
  if(l==="en"){
    document.documentElement.lang="en";document.title="Page not found — VIVI Roma";
    document.getElementById("k").textContent="Error 404";
    document.getElementById("t").textContent="Page not found";
    document.getElementById("d").textContent="This address doesn't exist or has moved. Your trip can start again from here.";
    document.getElementById("home").textContent="Back to VIVI Roma";
    document.getElementById("quiz").textContent="Create a new itinerary";
  }
})();</script>
</body>
</html>
