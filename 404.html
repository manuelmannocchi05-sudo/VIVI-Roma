<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagina non trovata — VIVI Roma</title>
<meta name="theme-color" content="#292622">
<style>
/* Pagina d'errore autonoma (nessun file esterno): serve anche a Cloudflare Pages per non restituire la home
   al posto di un file mancante. Colori e caratteri del sito. */
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:#292622;color:#F5EFE4;font:16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.1;margin:0 0 12px}
p{margin:0 0 6px;color:rgba(245,241,232,.82)}
a{display:inline-block;margin-top:22px;padding:13px 26px;border-radius:999px;background:#D9A66F;color:#292622;font-weight:600;text-decoration:none}
a:focus-visible{outline:2px solid #F5EFE4;outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Pagina non trovata</h1>
  <p>L'indirizzo non esiste o è cambiato.</p>
  <p lang="en">This page doesn't exist or has moved.</p>
  <a id="home" href="/">Torna a VIVI Roma</a>
</main>
<script>/* su GitHub Pages il sito vive in /VIVI-Roma/, su Cloudflare Pages nella radice */
(function(){var m=location.pathname.match(/^\/VIVI-Roma\//i);if(m)document.getElementById("home").href=m[0];})();</script>
</body>
</html>
