```html
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIVI — Non visitare Roma. Vivila.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Inter",sans-serif;
    background:#f5f0e8;
    color:#191816;
    line-height:1.6;
}

button{
    font-family:inherit;
}

img{
    width:100%;
    display:block;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

section{
    padding:110px 0;
}

/* NAV */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    background:rgba(245,240,232,.95);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(0,0,0,.08);
}

.nav-inner{
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:"Cormorant Garamond",serif;
    font-size:38px;
    font-weight:700;
    letter-spacing:5px;
}

.nav-links{
    display:flex;
    gap:30px;
    font-size:13px;
}

.nav-links a:hover{
    opacity:.55;
}

.nav-button{
    border:0;
    background:#191816;
    color:white;
    border-radius:40px;
    padding:13px 20px;
    cursor:pointer;
    font-weight:600;
}

/* HERO */

.hero{
    min-height:100vh;
    padding-top:120px;
    display:flex;
    align-items:center;
}

.hero-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:65px;
    align-items:center;
}

.eyebrow{
    color:#8e3027;
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:10px;
    font-weight:700;
    margin-bottom:18px;
}

.hero h1{
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(62px,8vw,105px);
    line-height:.85;
    font-weight:500;
    margin-bottom:30px;
}

.hero h1 em{
    font-style:italic;
}

.hero p{
    max-width:530px;
    color:#6b645c;
    font-size:17px;
    line-height:1.8;
    margin-bottom:35px;
}

.primary-button{
    border:0;
    background:#191816;
    color:white;
    padding:17px 27px;
    border-radius:40px;
    cursor:pointer;
    font-weight:600;
    transition:.25s;
}

.primary-button:hover{
    transform:translateY(-3px);
}

.hero-image{
    height:650px;
    overflow:hidden;
    border-radius:190px 190px 28px 28px;
    box-shadow:0 25px 70px rgba(0,0,0,.12);
}

.hero-image img{
    height:100%;
    object-fit:cover;
}

/* TITOLI */

.section-title{
    max-width:760px;
    margin-bottom:55px;
}

.section-title h2{
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(48px,6vw,72px);
    line-height:.9;
    font-weight:500;
}

.section-title p{
    margin-top:20px;
    color:#6d665e;
}

/* ESPERIENZE */

.experiences{
    background:#e9e0d4;
}

.experience-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.experience-card{
    min-height:240px;
    border:1px solid #d2c7b9;
    background:#f8f3eb;
    border-radius:25px;
    padding:27px;
    text-align:left;
    cursor:pointer;
    transition:.3s;
}

.experience-card:hover{
    transform:translateY(-7px);
    border-color:#b28d55;
    box-shadow:0 18px 40px rgba(0,0,0,.08);
}

.experience-number{
    color:#b28d55;
    font-family:"Cormorant Garamond",serif;
    font-size:20px;
}

.experience-card h3{
    font-family:"Cormorant Garamond",serif;
    font-size:34px;
    font-weight:500;
    margin-top:65px;
    margin-bottom:10px;
}

.experience-card p{
    color:#706960;
    font-size:13px;
}

/* BUILDER */

.builder{
    background:#f5f0e8;
}

.builder-wrapper{
    max-width:900px;
    margin:auto;
}

.builder-box{
    background:#fbf8f2;
    border:1px solid #d9d0c4;
    border-radius:32px;
    padding:45px;
    box-shadow:0 20px 60px rgba(0,0,0,.07);
}

.step-counter{
    color:#8e3027;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:10px;
    font-weight:700;
    margin-bottom:10px;
}

#stepTitle{
    font-family:"Cormorant Garamond",serif;
    font-size:52px;
    font-weight:500;
    line-height:1;
    margin-bottom:12px;
}

#stepDescription{
    color:#6d665e;
    max-width:650px;
    margin-bottom:32px;
}

.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.option{
    min-height:70px;
    border:1px solid #d8cfc3;
    background:#f6f1e9;
    border-radius:17px;
    padding:17px 20px;
    text-align:left;
    cursor:pointer;
    transition:.25s;
}

.option:hover{
    border-color:#b28d55;
    transform:translateY(-2px);
}

.option.selected{
    background:#e6d8c5;
    border-color:#b28d55;
}

.builder-controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:30px;
}

.back-button{
    border:1px solid #bdb3a7;
    background:transparent;
    border-radius:30px;
    padding:13px 20px;
    cursor:pointer;
}

.next-button{
    border:0;
    background:#191816;
    color:white;
    border-radius:30px;
    padding:14px 23px;
    cursor:pointer;
    font-weight:600;
}

/* RISULTATO */

.resul
