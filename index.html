{id:'colosseo',name:'Colosseo',area:'Roma antica',lat:41.8902,lng:12.4922,cats:['history','art','iconic','stories','photos'],time:'60–90 min',cost:'Biglietto',desc:'L’anfiteatro simbolo di Roma racconta spettacoli, potere e vita pubblica dell’antichità.',chicca:'Osserva gli archi su più livelli: non sono tutti uguali e aiutano a capire quanto fosse avanzato il progetto.',consiglio:'Prenota l’ingresso ufficiale in anticipo e abbina la visita al Foro Romano; considera controlli e tempi di accesso.'},
{id:'fori',name:'Fori Imperiali',area:'Roma antica',lat:41.8947,lng:12.4930,cats:['history','art','iconic','stories','photos'],time:'45–75 min',cost:'Vista esterna / accessi variabili',desc:'Una sequenza di piazze monumentali che mostra il cuore politico dell’antica Roma.',chicca:'Dalla passeggiata lungo Via dei Fori Imperiali si leggono bene le diverse stratificazioni della città.',consiglio:'Percorri il tratto con calma e guarda anche i punti panoramici laterali, non soltanto la strada principale.'},
{id:'pantheon',name:'Pantheon',area:'Centro storico',lat:41.8986,lng:12.4769,cats:['history','art','iconic','religious','stories'],time:'30–45 min',cost:'Verifica ticket e orari',desc:'Un capolavoro di architettura antica, celebre per la grande cupola e l’oculo centrale.',chicca:'Nelle giornate di pioggia l’acqua entra dall’oculo e viene raccolta da piccoli fori nel pavimento.',consiglio:'Controlla le modalità di accesso aggiornate e visita la piazza presto, quando è più tranquilla.'},
{id:'trevi',name:'Fontana di Trevi',area:'Centro storico',lat:41.9009,lng:12.4833,cats:['history','art','iconic','romantic','photos'],time:'20–35 min',cost:'Area pubblica; regole possono variare',desc:'Una scenografica fontana barocca incastonata in una piazza raccolta.',chicca:'La fontana è la mostra terminale dell’antico acquedotto dell’Acqua Vergine.',consiglio:'Vai al mattino presto o in tarda serata per goderti meglio lo spazio; non entrare nella vasca.'},
{id:'navona',name:'Piazza Navona',area:'Centro storico',lat:41.8992,lng:12.4731,cats:['art','iconic','romantic','food','photos'],time:'25–45 min',cost:'Gratuito',desc:'Una delle piazze più eleganti di Roma, con fontane barocche e facciate monumentali.',chicca:'La forma allungata ricalca lo stadio di Domiziano, costruito in epoca romana.',consiglio:'Fai un giro completo della piazza e poi esplora le stradine laterali: spesso sono più piacevoli dei tavoli in prima fila.'},
{id:'spagna',name:'Piazza di Spagna',area:'Tridente',lat:41.9059,lng:12.4823,cats:['art','iconic','romantic','photos'],time:'25–40 min',cost:'Gratuito',desc:'La scalinata di Trinità dei Monti collega la piazza alla chiesa in uno degli scorci più noti della città.',chicca:'La Barcaccia, ai piedi della scalinata, è opera di Pietro e Gian Lorenzo Bernini.',consiglio:'Rispetta le regole locali sulla scalinata e prosegui a piedi verso Via Margutta o Villa Borghese.'},
{id:'trastevere',name:'Trastevere',area:'Riva ovest',lat:41.8897,lng:12.4692,cats:['hidden','romantic','food','local','lively','night'],time:'1–2 ore',cost:'Gratuito; consumazioni a parte',desc:'Vicolo dopo vicolo, piazzette, botteghe e trattorie compongono uno dei quartieri più vivaci di Roma.',chicca:'Allontanandoti di poche strade dalle vie più affollate trovi cortili, edicole votive e scorci silenziosi.',consiglio:'Esploralo nel tardo pomeriggio e fermati a mangiare in una strada secondaria, controllando menu e prezzi prima di sederti.'},
{id:'monti',name:'Rione Monti',area:'Esquilino / Colle Oppio',lat:41.8955,lng:12.4905,cats:['hidden','food','local','lively','night','history'],time:'45–90 min',cost:'Gratuito; consumazioni a parte',desc:'Un quartiere centrale dal carattere di borgo, tra piazzette, piccole gallerie e locali indipendenti.',chicca:'Piazza della Madonna dei Monti è un luogo di ritrovo quotidiano, non solo una tappa fotografica.',consiglio:'Passeggia senza una meta precisa tra Via dei Serpenti e le strade laterali; è ideale dopo il Colosseo.'},
{id:'testaccio',name:'Testaccio',area:'Roma popolare',lat:41.8762,lng:12.4761,cats:['food','hidden','local','lively'],time:'1–2 ore',cost:'Variabile',desc:'Un quartiere legato alla cucina romana, ai mercati e alla storia del lavoro e dei commerci.',chicca:'Il Monte dei Cocci è formato da frammenti di anfore accumulate nell’antichità.',consiglio:'Verifica in anticipo giorni e orari del mercato; per assaggiare più cose, scegli porzioni piccole e condividile.'},
{id:'campo',name:'Campo de’ Fiori',area:'Centro storico',lat:41.8956,lng:12.4722,cats:['food','local','lively','history'],time:'30–60 min',cost:'Gratuito',desc:'Piazza vivace di giorno e punto di ritrovo la sera, circondata da strade storiche.',chicca:'Il mercato è una tradizione storica della piazza, ma le bancarelle e gli orari cambiano secondo il giorno.',consiglio:'Vai la mattina per il mercato e poi cammina verso Piazza Farnese e le vie meno trafficate.'},
{id:'gianicolo',name:'Terrazza del Gianicolo',area:'Panorami',lat:41.8919,lng:12.4608,cats:['romantic','nature','photos','peaceful'],time:'30–50 min',cost:'Gratuito',desc:'Uno dei panorami più ampi sui tetti e sulle cupole di Roma.',chicca:'La vista permette di riconoscere molte cupole e monumenti: prova a individuarli uno a uno.',consiglio:'Il tramonto è suggestivo ma affollato; porta acqua e considera la salita a piedi.'},
{id:'pincio',name:'Terrazza del Pincio',area:'Villa Borghese',lat:41.9117,lng:12.4834,cats:['romantic','nature','photos','peaceful'],time:'25–45 min',cost:'Gratuito',desc:'Una terrazza panoramica sopra Piazza del Popolo, perfetta per una passeggiata lenta.',chicca:'La prospettiva sulla piazza è particolarmente leggibile dall’alto, con l’obelisco al centro.',consiglio:'Abbinala a una passeggiata a Villa Borghese o a Piazza del Popolo, senza programmare troppe tappe vicine.'},
{id:'borghese',name:'Villa Borghese',area:'Verde',lat:41.9142,lng:12.4922,cats:['nature','romantic','peaceful','family'],time:'1–2 ore',cost:'Parco gratuito; attrazioni a pagamento',desc:'Un grande parco cittadino tra viali alberati, prati, laghetti e musei.',chicca:'Il parco ha diversi accessi e zone molto diverse: non è necessario attraversarlo tutto per goderselo.',consiglio:'Scegli prima una zona e porta acqua; per la Galleria Borghese è normalmente necessaria la prenotazione.'},
{id:'aventino',name:'Giardino degli Aranci',area:'Aventino',lat:41.8839,lng:12.4794,cats:['romantic','nature','hidden','photos','peaceful'],time:'25–40 min',cost:'Gratuito',desc:'Un giardino raccolto con una bella vista sul Tevere e sui tetti di Roma.',chicca:'Nelle vicinanze, il famoso buco della serratura offre un’inquadratura sorprendente della cupola di San Pietro.',consiglio:'Abbina giardino e buco della serratura rispettando la fila; la luce del tardo pomeriggio è spesso bellissima.'},
{id:'coppede',name:'Quartiere Coppedè',area:'Roma insolita',lat:41.9242,lng:12.5250,cats:['hidden','art','photos','peaceful'],time:'35–60 min',cost:'Gratuito',desc:'Un piccolo insieme architettonico fuori dai percorsi più classici, ricco di dettagli fantastici e stili mescolati.',chicca:'Non è un unico edificio ma un complesso di palazzi e villini con decorazioni tutte da osservare.',consiglio:'È un quartiere abitato: fotografa con discrezione e rispetta portoni, cortili privati e residenti.'},
{id:'appia',name:'Via Appia Antica',area:'Archeologia e natura',lat:41.8467,lng:12.5331,cats:['history','nature','hidden','photos','peaceful'],time:'1–3 ore',cost:'Tratto stradale gratuito; siti a pagamento',desc:'Un’antica strada romana immersa in un paesaggio sorprendentemente verde.',chicca:'I grandi basoli e i monumenti funerari raccontano il ruolo della strada come via d’uscita dalla città.',consiglio:'Controlla accessi e disponibilità di bici o bus prima di partire; scarpe comode e acqua sono essenziali.'},
{id:'ponte-sisto',name:'Ponte Sisto',area:'Tevere',lat:41.8914,lng:12.4715,cats:['romantic','photos','night','local'],time:'15–25 min',cost:'Gratuito',desc:'Un ponte pedonale molto piacevole per passare dal centro storico a Trastevere.',chicca:'Le aperture sul parapetto alleggeriscono la struttura e incorniciano scorci del fiume.',consiglio:'Usalo come tappa di passaggio al tramonto, poi continua a piedi verso Trastevere.'},
{id:'castel',name:'Castel Sant’Angelo',area:'Borgo e Tevere',lat:41.9031,lng:12.4663,cats:['history','art','iconic','photos'],time:'60–90 min',cost:'Biglietto per il museo',desc:'Un edificio nato come mausoleo imperiale e trasformato nei secoli in fortezza e residenza.',chicca:'Il passetto sopraelevato lo collegava al Vaticano e serviva da via protetta.',consiglio:'Controlla orari e biglietti del museo; anche il ponte esterno merita una sosta per le statue e la vista.'},
{id:'vaticano',name:'Piazza San Pietro',area:'Vaticano',lat:41.9022,lng:12.4539,cats:['religious','art','history','iconic','photos'],time:'45–90 min',cost:'Piazza gratuita; basilica e musei con regole proprie',desc:'Il grande abbraccio del colonnato di Bernini introduce al cuore monumentale del Vaticano.',chicca:'Il colonnato è progettato per creare un effetto prospettico che cambia mentre ti sposti.',consiglio:'Per entrare nei luoghi religiosi serve abbigliamento adeguato; controlla sempre code, orari e regole aggiornate.'},
{id:'san-clemente',name:'Basilica di San Clemente',area:'Celio',lat:41.8895,lng:12.4988,cats:['religious','history','hidden','art','stories'],time:'45–75 min',cost:'Verifica biglietto per i livelli archeologici',desc:'Una visita sorprendente attraverso strati di storia, dalla basilica medievale agli ambienti più antichi.',chicca:'Il complesso permette di scendere letteralmente attraverso epoche diverse della città.',consiglio:'Verifica aperture e accessi ai livelli sotterranei prima di andarci; è una tappa ideale per chi ama l’archeologia.'},
{id:'caracalla',name:'Terme di Caracalla',area:'Aventino / Celio',lat:41.8792,lng:12.4923,cats:['history','art','photos','peaceful'],time:'45–75 min',cost:'Biglietto',desc:'Resti monumentali di uno dei grandi complessi termali dell’antica Roma.',chicca:'Le dimensioni si capiscono meglio osservando la pianta complessiva, non un singolo muro.',consiglio:'In estate scegli le ore meno calde e porta acqua; controlla eventuali aperture speciali.'},
{id:'piazza-popolo',name:'Piazza del Popolo',area:'Tridente',lat:41.9105,lng:12.4763,cats:['history','art','iconic','photos'],time:'25–40 min',cost:'Gratuito',desc:'Una grande porta urbana con obelisco, chiese gemelle e accesso al Tridente.',chicca:'Le due chiese che sembrano gemelle presentano differenze dovute anche alla forma irregolare della piazza.',consiglio:'Guarda la piazza sia dal basso sia dalla terrazza del Pincio per cogliere due prospettive diverse.'},
{id:'via-margutta',name:'Via Margutta',area:'Tridente',lat:41.9081,lng:12.4810,cats:['hidden','art','romantic','peaceful'],time:'20–35 min',cost:'Gratuito',desc:'Una strada raccolta legata alla storia di artisti, atelier e botteghe.',chicca:'Dietro le facciate discrete si nascondono cortili e spazi creativi, spesso non accessibili al pubblico.',consiglio:'Cammina lentamente e osserva i dettagli; abbinala a Piazza di Spagna evitando le ore più affollate.'},
{id:'quartiere-garbatella',name:'Garbatella',area:'Roma di quartiere',lat:41.8641,lng:12.4918,cats:['hidden','local','food','photos','peaceful'],time:'45–90 min',cost:'Gratuito',desc:'Un quartiere dalla forte identità, noto per l’urbanistica a lotti, le piazzette e i giardini condivisi.',chicca:'I lotti storici sono pensati come piccoli nuclei di vicinato con cortili e spazi comuni.',consiglio:'È una zona abitata: esplora a piedi rispettando la privacy e fermati in un bar di quartiere.'},
{id:'ostiense',name:'Ostiense e street art',area:'Roma contemporanea',lat:41.8658,lng:12.4777,cats:['art','hidden','local','photos','lively'],time:'45–90 min',cost:'Gratuito',desc:'Archeologia industriale, murales e spazi culturali raccontano una Roma contemporanea.',chicca:'Molte opere sono su facciate di edifici ordinari: il quartiere stesso diventa una galleria all’aperto.',consiglio:'Cerca le opere principali a piedi e verifica in anticipo l’apertura di eventuali spazi culturali.'},
{id:'mercato-testaccio',name:'Mercato di Testaccio',area:'Testaccio',lat:41.8764,lng:12.4767,cats:['food','local','family'],time:'40–75 min',cost:'Variabile',desc:'Un mercato coperto per assaggiare prodotti e specialità in un’atmosfera quotidiana.',chicca:'Il mercato è un buon modo per conoscere le abitudini alimentari locali oltre ai ristoranti tradizionali.',consiglio:'Controlla i giorni di apertura e arriva prima dell’orario di chiusura per trovare più scelta.'},
{id:'isola-tiberina',name:'Isola Tiberina',area:'Tevere',lat:41.8905,lng:12.4773,cats:['history','romantic','photos','peaceful'],time:'20–35 min',cost:'Gratuito',desc:'Una piccola isola urbana collegata alle due sponde del Tevere da ponti storici.',chicca:'La forma dell’isola ha alimentato per secoli leggende e simboli legati alla medicina.',consiglio:'Attraversala a piedi e continua verso il Ghetto ebraico per un percorso ricco di storia.'},

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
let currentStep=0,days=[],activeDay=0,map=null,markers=[];
const questions=$$('.question');

function setStep(n){
  currentStep=Math.max(0,Math.min(questions.length-1,n));
  questions.forEach((q,i)=>q.classList.toggle('active',i===currentStep));
  $('#prevBtn').disabled=currentStep===0;
  $('#nextBtn').hidden=currentStep===questions.length-1;
  $('#createBtn').hidden=currentStep!==questions.length-1;
  $('#questionCounter').textContent=`Domanda ${currentStep+1} di ${questions.length}`;
  $('#progressFill').style.width=`${(currentStep+1)/questions.length*100}%`;
  $('#quizError').style.display='none';
}

function answer(name){
  const el=$(`input[name="${name}"]:checked`);
  return el?el.value:'';
}
function selected(name){
  return $$(`input[name="${name}"]:checked`).map(x=>x.value);
}
function validStep(){
  const q=questions[currentStep],inputs=[...q.querySelectorAll('input')];
  if(currentStep===4)return inputs.some(i=>i.checked);
  return inputs.some(i=>i.checked&&i.type==='radio');
}

$('#nextBtn').addEventListener('click',()=>{
  if(!validStep()){
    $('#quizError').style.display='block';
    return;
  }
  setStep(currentStep+1);
});
$('#prevBtn').addEventListener('click',()=>setStep(currentStep-1));

$('#travelQuiz').addEventListener('submit',e=>{
  e.preventDefault();
  if(!validStep()){
    $('#quizError').style.display='block';
    return;
  }
  generateTrip();
});

$$('[data-interest]').forEach(b=>b.addEventListener('click',()=>{
  const box=$(`input[name="interests"][value="${b.dataset.interest}"]`);
  if(box)box.checked=true;
  $('#crea').scrollIntoView({behavior:'smooth'});
  setStep(4);
}));

$('#menuToggle').addEventListener('click',()=>{
  const open=$('#navLinks').classList.toggle('open');
  $('#menuToggle').setAttribute('aria-expanded',String(open));
});
$$('#navLinks a').forEach(a=>a.addEventListener('click',()=>$('#navLinks').classList.remove('open')));

$('#editBtn').addEventListener('click',()=>{
  $('#results').classList.remove('visible');
  $('#travelQuiz').scrollIntoView({behavior:'smooth',block:'start'});
  setStep(0);
});
$('#newTripBtn').addEventListener('click',()=>{
  $('#travelQuiz').reset();
  $('#results').classList.remove('visible');
  setStep(0);
  $('#crea').scrollIntoView({behavior:'smooth'});
});
$('#printBtn').addEventListener('click',()=>window.print());

function daysWanted(){
  return ({half:1,one:1,two:2,three:3,four:4})[answer('duration')]||1;
}
function stopsPerDay(){
  if(answer('duration')==='half')return 3;
  if(answer('pace')==='slow'||answer('walking')==='low')return 4;
  if(answer('pace')==='full'&&answer('walking')==='high')return 6;
  return 5;
}
function scorePlace(p,interests,company,familiarity,mood){
  let s=0;
  interests.forEach(i=>{if(p.cats.includes(i))s+=3});
  if(mood==='local'&&p.cats.includes('local'))s+=3;
  if(mood==='iconic'&&p.cats.includes('iconic'))s+=3;
  if(mood==='peaceful'&&p.cats.includes('peaceful'))s+=3;
  if(mood==='lively'&&p.cats.includes('lively'))s+=3;
  if(company==='couple'&&p.cats.includes('romantic'))s+=2;
  if(company==='family'&&p.cats.includes('family'))s+=2;
  if(familiarity==='first'&&p.cats.includes('iconic'))s+=2;
  if(familiarity==='often'&&p.cats.includes('hidden'))s+=2;
  if(!interests.length&&p.cats.includes('history'))s+=1;
  return s+Math.random()*.08;
}

function generateTrip(){
  const interests=selected('interests');
  const company=answer('company');
  const familiarity=answer('familiarity');
  const mood=answer('mood');
  const totalDays=daysWanted();
  const limit=stopsPerDay();
  let candidates=places.map(p=>({...p,score:scorePlace(p,interests,company,familiarity,mood)})).sort((a,b)=>b.score-a.score);

  if(familiarity==='first'){
    const iconic=places.filter(p=>p.cats.includes('iconic'));
    candidates=[
      ...iconic.sort((a,b)=>scorePlace(b,interests,company,familiarity,mood)-scorePlace(a,interests,company,familiarity,mood)),
      ...candidates.filter(p=>!p.cats.includes('iconic'))
    ];
  }

  const wanted=Math.min(candidates.length,totalDays*limit);
  let chosen=[],remaining=[...candidates];

  while(chosen.length<wanted&&remaining.length){
    let next;
    if(!chosen.length)next=remaining.shift();
    else{
      const last=chosen[chosen.length-1];
      remaining.sort((a,b)=>distance(last,a)-distance(last,b)+((b.score-a.score)*.035));
      next=remaining.shift();
    }
    if(next&&!chosen.some(p=>p.id===next.id))chosen.push(next);
  }

  days=[];
  for(let d=0;d<totalDays;d++){
    const group=chosen.slice(d*limit,(d+1)*limit);
    if(group.length)days.push(group);
  }
  if(!days.length)days=[places.slice(0,3)];

  activeDay=0;
  $('#results').classList.add('visible');
  $('#resultTitle').textContent=company==='couple'?'Una Roma da condividere.':company==='family'?'Roma da vivere insieme.':'La tua Roma, giorno per giorno.';
  $('#resultSubtitle').textContent=interests.length?`Un percorso ispirato a: ${interests.map(labelInterest).join(', ')}.`:'Un mix di grandi classici, quartieri e angoli da scoprire.';
  $('#resultsMeta').innerHTML=`<span class="pill">${days.length} ${days.length===1?'giornata':'giornate'}</span><span class="pill">${chosen.length} tappe selezionate</span><span class="pill">${paceLabel()}</span><span class="pill">${companyLabel(company)}</span>`;
  renderDays();
  $('#results').scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(()=>initMap(),350);
}

function distance(a,b){
  return Math.hypot((a.lat-b.lat)*80,(a.lng-b.lng)*60);
}
function labelInterest(i){
  return ({
    history:'storia e monumenti',
    art:'arte e musei',
    hidden:'Roma nascosta',
    romantic:'romanticismo e panorami',
    nature:'verde e passeggiate',
    food:'cibo e mercati',
    religious:'Roma religiosa',
    night:'Roma di sera'
  })[i]||i;
}
function paceLabel(){
  return ({slow:'Ritmo lento',balanced:'Ritmo equilibrato',full:'Ritmo intenso'})[answer('pace')]||'Ritmo equilibrato';
}
function companyLabel(c){
  return ({solo:'In solitaria',couple:'In coppia',friends:'Con amici',family:'In famiglia'})[c]||'Su misura';
}

function renderDays(){
  const tabs=$('#dayTabs');
  tabs.innerHTML='';
  days.forEach((day,i)=>{
    const b=document.createElement('button');
    b.className='day-tab'+(i===activeDay?' active':'');
    b.textContent=days.length===1?'Il tuo percorso':`Giorno ${i+1}`;
    b.addEventListener('click',()=>{
      activeDay=i;
      renderDays();
      updateMap();
    });
    tabs.appendChild(b);
  });

  const group=days[activeDay]||[];
  $('#dayIntro').textContent=answer('duration')==='half'
    ?'Mezza giornata: tre tappe scelte per lasciare spazio anche a una pausa.'
    :`Giorno ${activeDay+1}: ${group.length} tappe selezionate. Gli spostamenti sono indicativi: apri le indicazioni per verificare il percorso più adatto.`;

  $('#stops').innerHTML=group.map((p,i)=>`
    <article class="stop">
      <div class="stop-photo">
        <img loading="lazy" data-wiki="${p.name.replaceAll('"','&quot;')}" alt="${p.name}" src="${fallbackImage(p)}" onerror="this.onerror=null;this.src='${fallbackImage(p)}'">
      </div>
      <div>
        <div class="stop-area">${p.area} · Tappa ${i+1}</div>
        <h3>${p.name}</h3>
        <p class="stop-desc">${p.desc}</p>
        <div class="stop-facts"><span>◷ ${p.time}</span><span>${p.cost}</span></div>
        <div class="tip"><strong>La chicca</strong>${p.chicca}</div>
        <div class="tip"><strong>Il consiglio di VIVI</strong>${p.consiglio}</div>
        <div class="stop-links">
          <a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">Apri indicazioni ↗</a>
          <a target="_blank" rel="noopener" href="https://it.wikipedia.org/wiki/${encodeURIComponent(wikiTitle(p))}">Scopri la storia ↗</a>
        </div>
      </div>
    </article>`).join('');

  loadWikiImages();
}

function wikiTitle(p){
  return ({
    'Terrazza del Gianicolo':'Terrazza del Gianicolo',
    'Rione Monti':'Rione Monti (Roma)',
    'Giardino degli Aranci':'Giardino degli Aranci',
    'Via Appia Antica':'Via Appia Antica',
    'Quartiere Coppedè':'Quartiere Coppedè',
    'Piazza di Spagna':'Piazza di Spagna',
    'Piazza San Pietro':'Piazza San Pietro'
  })[p.name]||p.name;
}

function fallbackImage(p){
  const imgs={
    Colosseo:'photo-1552832230-c0197dd311b5',
    'Fori Imperiali':'photo-1552832230-c0197dd311b5',
    Pantheon:'photo-1515542622106-78bda8ba0e5b',
    'Fontana di Trevi':'photo-1515542622106-78bda8ba0e5b',
    'Piazza Navona':'photo-1515542622106-78bda8ba0e5b',
    Trastevere:'photo-1516483638261-f4dbaf036963',
    'Villa Borghese':'photo-1441974231531-c6227db76b6e',
    'Terrazza del Gianicolo':'photo-1515542622106-78bda8ba0e5b'
  };
  return `https://images.unsplash.com/${imgs[p.name]||'photo-1515542622106-78bda8ba0e5b'}?auto=format&fit=crop&w=700&q=80`;
}

async function loadWikiImages(){
  const imgs=$$('img[data-wiki]');
  for(const img of imgs){
    const title=img.dataset.wiki;
    try{
      const url='https://it.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(wikiTitle(places.find(p=>p.name===title)||{name:title}));
      const r=await fetch(url);
      if(!r.ok)continue;
      const d=await r.json();
      if(d.thumbnail&&d.thumbnail.source){
        img.src=d.thumbnail.source;
        img.onerror=()=>{
          img.onerror=null;
          img.src=fallbackImage(places.find(p=>p.name===title)||{name:title});
        };
      }
    }catch(e){
      /* Le immagini di riserva restano visibili anche senza connessione all'API */
    }
  }
}

function initMap(){
  if(!window.L)return;
  if(!map){
    map=L.map('map').setView([41.9,12.48],12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; OpenStreetMap contributors',
      maxZoom:19
    }).addTo(map);
  }
  updateMap();
  setTimeout(()=>map.invalidateSize(),100);
}
function updateMap(){
  if(!map)return;
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  const group=days[activeDay]||[];
  group.forEach((p,i)=>{
    const marker=L.marker([p.lat,p.lng]).addTo(map).bindPopup(
      `<strong>${i+1}. ${p.name}</strong><br>${p.area}<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">Indicazioni</a>`
    );
    markers.push(marker);
  });
  if(group.length){
    const bounds=L.latLngBounds(group.map(p=>[p.lat,p.lng]));
    map.fitBounds(bounds.pad(.18),{maxZoom:14});
  }
}

setStep(0);
loadWikiImages();
</script>
